# ~/.config/tmux/tmux.conf

# ============================================================
#  Core
# ============================================================
# Prefix: Ctrl-a (easier than Ctrl-b, esp. with Caps=Ctrl). C-b stays as backup.
set -g prefix C-a
bind C-a send-prefix

# True color + correct TERM
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB"

set -g mouse on                 # mouse: select panes, resize, scroll
set -g history-limit 50000      # big scrollback
set -sg escape-time 10          # no lag for Esc in vim/nvim
set -g focus-events on
set -g set-clipboard on
set -g display-time 2000        # status messages linger 2s
set -g display-panes-time 2000  # pane numbers (prefix q) linger 2s

# Windows/panes start at 1, renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S  #W"

# ============================================================
#  Reload / Help
# ============================================================
bind r source-file ~/.config/tmux/tmux.conf \; display " Config reloaded"

# Cheat-sheet overlay (centered popup). q to close.
bind ? display-popup -E -b rounded -w 92 -h 90% "less -R ~/.config/tmux/cheatsheet.txt"

# Raw full key list moved here:
bind C-? list-keys

# ============================================================
#  Windows
# ============================================================
bind c new-window -c "#{pane_current_path}"          # new window (keep cwd)
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind Tab last-window                                  # toggle last window
bind -r C-h previous-window                           # cycle windows
bind -r C-l next-window
bind -r < { swap-window -t -1; select-window -t -1 }  # move window left
bind -r > { swap-window -t +1; select-window -t +1 }  # move window right

# Jump to window by number, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ============================================================
#  Panes
# ============================================================
bind | split-window -h -c "#{pane_current_path}"     # split right
bind - split-window -v -c "#{pane_current_path}"     # split down
bind \\ split-window -fh -c "#{pane_current_path}"    # full-height split right
bind _ split-window -fv -c "#{pane_current_path}"     # full-width split down
unbind '"'
unbind %

# Navigate: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize: prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z                                 # zoom toggle
bind x kill-pane                                      # kill pane (no confirm)
bind Space next-layout                                # cycle layouts
# (swap panes with the default { and } )
bind b break-pane                                     # pane -> its own window
bind @ join-pane -h -s :                              # (prompted) join a pane here
bind e setw synchronize-panes \; display "sync #{?synchronize-panes,ON,off}"
bind q display-panes                                  # show pane numbers

# ============================================================
#  Sessions
# ============================================================
bind C-c new-session
bind R command-prompt -I "#S" "rename-session '%%'"   # rename session (C-r is resurrect-restore)
bind Q confirm-before -p "kill session #S? (y/n)" kill-session   # remove current session
bind s choose-tree -Zs                                # session/window picker
bind ( switch-client -p
bind ) switch-client -n

# ============================================================
#  Copy mode: vi keys + system clipboard (Wayland)
# ============================================================
setw -g mode-keys vi
bind v copy-mode
bind p paste-buffer -p
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ============================================================
#  Appearance — Catppuccin Mocha, no plugins
#  Each window is a self-contained rounded "pill" with a real
#  gap between them, so the active highlight never bleeds.
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name pill
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e]#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]  "
set -g status-left-length 40

# Right: prefix indicator + date/time pill
set -g status-right "#{?client_prefix,#[fg=#f38ba8#,bg=#1e1e2e]#[fg=#1e1e2e#,bg=#f38ba8#,bold] PREFIX #[fg=#f38ba8#,bg=#1e1e2e]  ,}#[fg=#a6adc8]%a %d %b  #[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] %H:%M #[fg=#cba6f7,bg=#1e1e2e]#[default]"
set -g status-right-length 60

# Gap between window pills (this is the key to clean, non-bleeding highlights)
set -g window-status-separator "  "

# Inactive window pill:  + body + , body has its own bg
setw -g window-status-format "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]"

# Active window pill
setw -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[fg=#1e1e2e,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=#1e1e2e]"

# Window with activity
setw -g window-status-activity-style "fg=#f9e2af"
setw -g monitor-activity on
set -g visual-activity off

# Panes
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#45475a"

# Messages / command prompt
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Copy-mode selection / search highlight
setw -g mode-style "bg=#f5e0dc,fg=#1e1e2e"

# ============================================================
#  Persistence — resurrect + continuum (survive reboot/quit)
#  Manual: prefix Ctrl-s = save, prefix Ctrl-r = restore
# ============================================================
set -g @resurrect-capture-pane-contents 'on'   # restore what was on screen
set -g @resurrect-strategy-nvim 'session'       # restore nvim sessions too
set -g @continuum-save-interval '5'             # auto-save every 5 min
set -g @continuum-restore 'on'                  # auto-restore on tmux start
# (run-shell lines must come AFTER the options above)
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
