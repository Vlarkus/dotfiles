# ~/.config/alacritty/alacritty.toml
# Alacritty 0.16+ config

[env]
TERM = "xterm-256color"

# Auto-start tmux via launcher: first window -> "main", extra windows get their
# own independent session (good for multi-monitor). See ~/.local/bin/tmux-attach
# Run `alacritty -e $SHELL` if you ever want a plain shell without tmux.
[terminal.shell]
program = "/home/vlarkus/.local/bin/tmux-attach"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "full"
opacity = 0.96
startup_mode = "Windowed"
dynamic_title = true

[scrolling]
history = 50000
multiplier = 3

[font]
size = 11.5
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true
thickness = 0.15

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

# ---- Keybindings ----
# New OS window (drag to another monitor) — shares the running process
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# ============ Colors: Catppuccin Mocha ============
[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
